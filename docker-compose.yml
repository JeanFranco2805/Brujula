services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./backend/.env.db
    ports:
      - "5433:5432"
    volumes:
      - brujula_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brujula -d brujula_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brujula_postgres_data:
